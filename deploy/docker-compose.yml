# 面试模拟系统 - VPS 一体化部署
# Go 后端 + Redis + MySQL + Nginx(反向代理/HTTPS) + Certbot(自动续期)
# 适用：内地 38 元秒杀档轻量服务器（2核2G/2核4G），Ubuntu 22.04

services:
  backend:
    build:
      context: ../api
    container_name: interview-backend
    restart: always
    # 仅绑定本机回环，外部一律经 Nginx 反代（调试时可 curl localhost:8080）
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: release
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    depends_on:
      - redis
      - mysql
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: interview-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-net

  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: interview_sim
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: interview-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - app-net

  # 证书自动续期：每 12 小时检查一次，续期成功自动重载 nginx
  certbot:
    image: certbot/certbot
    container_name: interview-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; nginx -s reload 2>/dev/null || true; sleep 12h & wait $${!}; done;"

networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
